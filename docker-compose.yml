services:
  app:
    build: .
    container_name: pick-club
    restart: unless-stopped
    ports:
      - "3001:3000"
    volumes:
      - pick-club-data:/app/data
    environment:
      - NODE_ENV=production
      - PORT=3000
      - BOT_NOTIFY_URL=${BOT_NOTIFY_URL}
      - SESSION_SECRET=${SESSION_SECRET}
    networks:
      - pickclub-shared

volumes:
  pick-club-data:

networks:
  pickclub-shared:
    name: pickclub-shared
    external: true
